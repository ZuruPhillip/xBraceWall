<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AAC 墙体 3D 渲染引擎</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0d0d1c; font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; overflow:hidden; }
    canvas { display:block; }

    /* ── 通用面板 ── */
    .panel {
      background: rgba(10,18,35,.88); backdrop-filter: blur(20px);
      border: 1px solid rgba(148,163,184,.12); border-radius: 14px;
      padding: 14px 16px; position: relative;
      transition: border-color .25s, box-shadow .25s;
    }
    .panel-title {
      font-size: 10px; font-weight: 700; color: #38bdf8;
      letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 12px; display: flex; align-items: center; gap: 6px;
    }
    .panel-title::before { content: ''; display: block;
      width: 3px; height: 12px; background: #38bdf8; border-radius: 2px; }

    /* ── 左侧信息面板（左上·与 MomWall3D 统一） ── */
    #info-panel {
      position: fixed; top: 14px; left: 14px;
      min-width: 220px; z-index: 100;
      pointer-events: none; display: none;
    }
    .param-val.highlight { color: #38bdf8; }
    .param-val.warn { color: #fbbf24; }
    .dim-visual {
      background: rgba(56,189,248,.04); border: 1px solid rgba(56,189,248,.1);
      border-radius: 10px; padding: 12px 14px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-around; gap: 6px;
    }
    .dim-box { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .dim-box-icon { font-size: 10px; color: #475569; letter-spacing: .5px; text-transform: uppercase; }
    .dim-box-val { font-size: 15px; font-weight: 800; color: #e2e8f0;
      font-variant-numeric: tabular-nums; line-height: 1; }
    .dim-box-unit { font-size: 9px; color: #475569; }
    .dim-sep { width: 1px; height: 32px; background: rgba(148,163,184,.1); }
    .param-row {
      display: flex; justify-content: space-between; align-items: center;
      gap: 10px; padding: 5px 0; border-bottom: 1px solid rgba(148,163,184,.06);
    }
    .param-row:last-child { border-bottom: none; }
    .param-lbl { color: #64748b; font-size: 11px; display: flex; align-items: center; gap: 5px; }
    .param-lbl .plbl-icon { font-size: 12px; }
    .param-val { color: #e2e8f0; font-weight: 600; font-size: 11.5px; font-variant-numeric: tabular-nums; }

    /* ── 图例（右上·与 MomWall3D 统一） ── */
    #legend {
      position:fixed; top:14px; right:14px;
      min-width: 220px; z-index: 100;
      pointer-events: none; display: none;
    }
    #legend .item { display:flex; align-items:center; margin-bottom:6px; font-size:11px; color:#cbd5e1; }
    #legend .dot { width:12px; height:12px; border-radius:2px; margin-right:9px; flex-shrink:0; border:1px solid rgba(255,255,255,0.10); }

    /* ── 砖块悬浮面板 ── */
    #brick-tooltip {
      position:fixed;
      background:rgba(8,8,28,0.95); backdrop-filter:blur(8px);
      border:1px solid #f5a623; border-radius:10px;
      padding:10px 14px; color:#fff;
      pointer-events:none; z-index:300; display:none;
      min-width:200px;
      box-shadow:0 4px 20px rgba(245,166,35,0.25);
    }
    #brick-tooltip .btitle {
      color:#f5a623; font-weight:700; font-size:10px;
      letter-spacing:1.5px; margin-bottom:7px;
      text-transform:uppercase;
    }
    #brick-tooltip .brow { display:flex; justify-content:space-between; gap:14px; margin-bottom:3px; font-size:12px; }
    #brick-tooltip .bkey { color:#ccaa66; }
    #brick-tooltip .bval { color:#fff; font-weight:600; font-size:11px; }

    /* ── 钢筋槽悬浮面板 ── */
    #rebar-tooltip {
      position:fixed;
      background:rgba(8,8,28,0.95); backdrop-filter:blur(8px);
      border:1px solid #ff8c42; border-radius:10px;
      padding:10px 14px; color:#fff;
      pointer-events:none; z-index:300; display:none;
      min-width:220px;
      box-shadow:0 4px 20px rgba(255,140,66,0.25);
    }
    #rebar-tooltip .rtitle {
      color:#ff8c42; font-weight:700; font-size:10px;
      letter-spacing:1.5px; margin-bottom:7px;
      text-transform:uppercase;
    }
    #rebar-tooltip .rrow { display:flex; justify-content:space-between; gap:14px; margin-bottom:3px; font-size:12px; }
    #rebar-tooltip .rkey { color:#cc8844; }
    #rebar-tooltip .rval { color:#fff; font-weight:600; font-size:11px; }

    /* ── 底部提示 ── */
    #hint-bar {
      position:fixed; bottom:18px; left:50%; transform:translateX(-50%);
      background:rgba(13,13,28,0.55); backdrop-filter:blur(4px);
      border:1px solid rgba(97,218,251,0.15); border-radius:24px;
      padding:7px 22px; display:flex; gap:16px;
      color:#8888aa; font-size:10px; z-index:100; white-space:nowrap;
      pointer-events:none;
    }
    #hint-bar b { color:#bbb; margin-right:2px; }
  </style>
</head>
<body>

<div class="panel" id="info-panel">
  <div class="panel-title" data-i18n="info_panel_title">墙体信息</div>
  <div class="dim-visual">
    <div class="dim-box">
      <span class="dim-box-icon" data-i18n="dim_length">长度</span>
      <span class="dim-box-val" id="v-x">—</span>
      <span class="dim-box-unit">mm</span>
    </div>
    <div class="dim-sep"></div>
    <div class="dim-box">
      <span class="dim-box-icon" data-i18n="dim_height">高度</span>
      <span class="dim-box-val" id="v-y">—</span>
      <span class="dim-box-unit">mm</span>
    </div>
    <div class="dim-sep"></div>
    <div class="dim-box">
      <span class="dim-box-icon" data-i18n="dim_thickness">厚度</span>
      <span class="dim-box-val" id="v-z">—</span>
      <span class="dim-box-unit">mm</span>
    </div>
  </div>
  <div class="param-row">
    <span class="param-lbl"><span class="plbl-icon">🏷</span><span data-i18n="param_material">材质</span></span>
    <span class="param-val" id="v-material">—</span>
  </div>
  <div class="param-row">
    <span class="param-lbl"><span class="plbl-icon">📦</span><span data-i18n="param_volume">毛体积</span></span>
    <span class="param-val highlight" id="v-volume">—</span>
  </div>
  <div class="param-row">
    <span class="param-lbl"><span class="plbl-icon">🧱</span><span data-i18n="param_slices">砖块分片</span></span>
    <span class="param-val" id="v-slc">—</span>
  </div>
  <div class="param-row">
    <span class="param-lbl"><span class="plbl-icon">📐</span><span data-i18n="param_vertices">轮廓顶点</span></span>
    <span class="param-val" id="v-ver">—</span>
  </div>
  <div class="param-row">
    <span class="param-lbl"><span class="plbl-icon">🔩</span><span data-i18n="param_rebar">钢筋槽</span></span>
    <span class="param-val" id="v-rebar">—</span>
  </div>
</div>

<div class="panel" id="legend">
  <div class="panel-title" data-i18n="legend_title">图例</div>
  <div class="item"><div class="dot" style="background:#c8d0d8;opacity:.45;"></div><span data-i18n="legend_wall">AAC 整体墙体</span></div>
  <div class="item"><div class="dot" style="background:#d5d5d5;"></div><span data-i18n="legend_brick_col0">砖块 · 列 0</span></div>
  <div class="item"><div class="dot" style="background:#c8c8c8;"></div><span data-i18n="legend_brick_col1">砖块 · 列 1</span></div>
  <div class="item"><div class="dot" style="background:#bbbbbb;"></div><span data-i18n="legend_brick_col2">砖块 · 列 2</span></div>
  <div class="item"><div class="dot" style="background:#ff6060;height:3px;border-radius:1px;"></div><span data-i18n="legend_glue_joint">竖向胶缝</span></div>
  <div class="item"><div class="dot" style="background:#ffd700;"></div><span data-i18n="legend_dims">尺寸标注</span></div>
  <div class="item"><div class="dot" style="background:#00ffcc;"></div><span data-i18n="legend_hover_edge">悬停高亮边</span></div>
  <div class="item"><div class="dot" style="background:#ff8c42;"></div><span data-i18n="legend_rebar_slots">钢筋槽</span></div>
</div>

<div id="brick-tooltip">
  <div class="btitle">🪨 <span data-i18n="brick_tooltip_title">砖块信息</span></div>
  <div class="brow"><span class="bkey" data-i18n="brick_col">列号</span><span class="bval" id="bt-col">—</span></div>
  <div class="brow"><span class="bkey" data-i18n="brick_width">宽度 (X)</span><span class="bval" id="bt-w">—</span></div>
  <div class="brow"><span class="bkey" data-i18n="brick_height">高度 (Y)</span><span class="bval" id="bt-h">—</span></div>
  <div class="brow"><span class="bkey" data-i18n="brick_thickness">厚度 (Z)</span><span class="bval" id="bt-t">—</span></div>
  <div class="brow"><span class="bkey" data-i18n="brick_glue">胶缝</span><span class="bval" id="bt-glue">—</span></div>
  <div class="brow"><span class="bkey" data-i18n="brick_partno">零件号</span><span class="bval" id="bt-pn">—</span></div>
</div>

<div id="rebar-tooltip">
  <div class="rtitle">🔩 <span data-i18n="rebar_tooltip_title">钢筋槽信息</span></div>
  <div class="rrow"><span class="rkey" data-i18n="rebar_direction">方向</span><span class="rval" id="rt-dir">—</span></div>
  <div class="rrow"><span class="rkey" data-i18n="rebar_diameter">直径</span><span class="rval" id="rt-dia">—</span></div>
  <div class="rrow"><span class="rkey" data-i18n="rebar_length">长度</span><span class="rval" id="rt-len">—</span></div>
  <div class="rrow"><span class="rkey" data-i18n="rebar_depth">深度</span><span class="rval" id="rt-dep">—</span></div>
  <div class="rrow"><span class="rkey" data-i18n="rebar_partno">零件号</span><span class="rval" id="rt-pn">—</span></div>
  <div class="rrow"><span class="rkey" data-i18n="rebar_start">起点</span><span class="rval" id="rt-start">—</span></div>
  <div class="rrow"><span class="rkey" data-i18n="rebar_end">终点</span><span class="rval" id="rt-end">—</span></div>
</div>

<div id="hint-bar">
  <span><b data-i18n="hint_left_btn">左键</b><span data-i18n="hint_rotate">旋转</span></span>
  <span><b data-i18n="hint_right_btn">右键</b><span data-i18n="hint_pan">平移</span></span>
  <span><b data-i18n="hint_wheel">滚轮</b><span data-i18n="hint_zoom">缩放</span></span>
  <span><b data-i18n="hint_dblclick">双击</b><span data-i18n="hint_reset">复位</span></span>
  <span><b data-i18n="hint_hover_edge">悬停墙边</b><span data-i18n="hint_measure">测量</span></span>
  <span><b data-i18n="hint_hover_brick">悬停砖块</b><span data-i18n="hint_info">信息</span></span>
  <span><b data-i18n="hint_hover_rebar">悬停钢筋槽</b><span data-i18n="hint_rebar_info">信息</span></span>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.140.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.140.0/examples/js/controls/OrbitControls.js"></script>

<script>
  /* ================================================================
   *  AAC 墙体 3D 渲染引擎 (wall3D_7)
   *  场景构建 / 射线检测 / 信息面板&图例(HTML自管) / 砖块悬浮(HTML)
   *  边缘测量 → postMessage → WPF
   * ================================================================ */

  var renderer, scene, camera, controls;
  var layers = {};
  var brickMeshes = [];
  var rebarMeshes = [];
  var rebarHitMeshes = [];
  var EDGES = [];
  var hlLine;
  var hovBrick = null;
  var defaultPos, defaultTarget;
  var BRICK_COLORS = [
    { face: 0xd5d5d5, side: 0xbfbfbf },
    { face: 0xc8c8c8, side: 0xb0b0b0 },
    { face: 0xbbbbbb, side: 0xa3a3a3 }
  ];
  var animateId = null;

  function notify(type, data) {
    if (window.chrome && window.chrome.webview) {
      try { window.chrome.webview.postMessage(type + ':' + JSON.stringify(data)); } catch (e) {}
    }
  }
  function notifyRaw(msg) {
    if (window.chrome && window.chrome.webview) {
      try { window.chrome.webview.postMessage(msg); } catch (e) {}
    }
  }

  /* ═══ 工具函数 ═══ */
  var fmt = function (v) { return (+v).toFixed(1); };
  function placeEl(el, mx, my, dy) {
    var tw = el.offsetWidth || 190, th = el.offsetHeight || 120;
    var tx = mx + 18, ty = my + 18 + (dy || 0);
    if (tx + tw > window.innerWidth) tx = mx - tw - 12;
    if (ty + th > window.innerHeight) ty = my - th - 12;
    el.style.left = tx + 'px'; el.style.top = ty + 'px';
  }

  /* ═══ 对外 API ═══ */

  window.loadWallData = function (jsonStr) {
    try {
      var D = JSON.parse(jsonStr);
      rebuildScene(D);
      notifyRaw('status:' + t('status_scene_rebuilt'));
    } catch (e) {
      notifyRaw('status:' + t('status_parse_fail') + e.message);
    }
  };

  window.toggleLayer = function (name, visible) {
    if (layers[name]) { layers[name].visible = visible; }
  };

  window.resetCamera = function () {
    if (camera && controls && defaultPos) {
      camera.position.copy(defaultPos);
      controls.target.copy(defaultTarget);
      controls.update();
      notifyRaw('status:' + t('status_view_reset'));
    }
  };

  /* ═══ 场景初始化 ═══ */
  function initScene() {
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.08;
    document.body.appendChild(renderer.domElement);

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d0d1c);
    scene.fog = new THREE.Fog(0x0d0d1c, 16000, 30000);

    camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 1, 60000);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 200;
    controls.maxDistance = 22000;

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    var sun = new THREE.DirectionalLight(0xfff8ee, 1.1);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 100; sun.shadow.camera.far = 18000;
    sun.shadow.camera.left = -2000; sun.shadow.camera.right = 2000;
    sun.shadow.camera.top = 4000; sun.shadow.camera.bottom = -500;
    sun.shadow.bias = -0.0003;
    scene.add(sun);

    var rim = new THREE.DirectionalLight(0x6688bb, 0.28);
    rim.position.set(-1800, 500, -2000);
    scene.add(rim);

    var hlMat = new THREE.LineBasicMaterial({ color: 0x00ffcc });
    var hlGeo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3()]);
    hlLine = new THREE.Line(hlGeo, hlMat);
    hlLine.visible = false;
    scene.add(hlLine);

    setupMouseInteraction();

    /* ── 双击复位 ── */
    renderer.domElement.addEventListener('dblclick', function () {
      if (camera && controls && defaultPos && defaultTarget) {
        camera.position.copy(defaultPos);
        controls.target.copy(defaultTarget);
        controls.update();
      }
    });

    window.addEventListener('resize', function () {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    notifyRaw('status:' + t('status_scene_ready'));

    (function animate() {
      animateId = requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    })();
  }

  /* ═══ 重建场景 ═══ */
  function rebuildScene(D) {
    clearScene();

    document.getElementById('info-panel').style.display = 'block';
    document.getElementById('legend').style.display = 'block';

    var W = Math.max.apply(null, D.wallContour.map(function (p) { return p.x; })) -
            Math.min.apply(null, D.wallContour.map(function (p) { return p.x; }));
    var H = Math.max.apply(null, D.wallContour.map(function (p) { return p.y; })) -
            Math.min.apply(null, D.wallContour.map(function (p) { return p.y; }));
    var TH = D.thickness;
    var xMinW = Math.min.apply(null, D.wallContour.map(function (p) { return p.x; }));
    var yMinW = Math.min.apply(null, D.wallContour.map(function (p) { return p.y; }));

    var cx = W / 2 + xMinW, cy = H / 2 + yMinW, cz = TH / 2;

    camera.position.set(cx + 1400, cy + 400, TH + 4500);
    controls.target.set(cx, cy, cz);
    controls.update();
    defaultPos = camera.position.clone();
    defaultTarget = controls.target.clone();

    scene.children.forEach(function (obj) {
      if (obj.isDirectionalLight && obj.intensity > 0.5) {
        obj.position.set(cx + 2200, H + 1500, TH + 2800);
      }
    });

    document.getElementById('v-x').textContent = (W).toFixed(1);
    document.getElementById('v-y').textContent = (H).toFixed(1);
    document.getElementById('v-z').textContent = (TH).toFixed(1);

    // 材质
    document.getElementById('v-material').textContent = D.material || 'AAC';

    // 毛体积 (mm³ → dm³ 或 cm³)
    var volMm3 = W * H * TH;
    var volCm3 = volMm3 * 1e-3; // mm³ → cm³ (实际上 mm³/1000 = cm³? 需要看单位)
    // 实际：1 mm = 0.001 m，所以 W*H*TH 单位是 mm³，1 cm³ = 1000 mm³
    var volCm3Real = volMm3 / 1000;
    document.getElementById('v-volume').textContent =
      volCm3Real >= 1e6 ? (volCm3Real / 1e6).toFixed(1) + ' m³'
      : volCm3Real >= 1000 ? (volCm3Real / 1000).toFixed(1) + ' dm³'
      : (+volCm3Real).toFixed(1) + ' cm³';

    document.getElementById('v-slc').textContent = D.slices.length + ' ' + t('brick_unit');
    document.getElementById('v-ver').textContent = D.wallContour.length + ' ' + t('vertex_unit');
    document.getElementById('v-rebar').textContent = (D.rebarSlots && D.rebarSlots.length || 0) + ' ' + t('rebar_unit');

    layers = { wall: new THREE.Group(), slices: new THREE.Group(), joints: new THREE.Group(), dim: new THREE.Group(), rebars: new THREE.Group() };
    for (var k in layers) scene.add(layers[k]);

    function makeShape(pts) {
      var s = new THREE.Shape();
      for (var i = 0; i < pts.length; i++) {
        if (i === 0) s.moveTo(pts[i].x, pts[i].y); else s.lineTo(pts[i].x, pts[i].y);
      }
      s.closePath(); return s;
    }
    function extrude(shape, depth, mat) {
      var m = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: depth, bevelEnabled: false }), mat);
      m.castShadow = true; m.receiveShadow = true; return m;
    }
    function addLine(pts, mat, grp) {
      var ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat);
      if (mat.isLineDashedMaterial) ln.computeLineDistances();
      grp.add(ln);
    }
    function v3(x, y, z) { return new THREE.Vector3(x, y, z); }

    // 整体墙体（颜色与 MomDataRenderPage 保持一致）
    var wFaceMat = new THREE.MeshStandardMaterial({
      color: 0xc8d0d8, roughness: 0.88, metalness: 0.03,
      transparent: true, opacity: 0.22, side: THREE.DoubleSide
    });
    var wSideMat = new THREE.MeshStandardMaterial({
      color: 0xb0b8c0, roughness: 0.88, metalness: 0.03, transparent: true, opacity: 0.22
    });
    layers.wall.add(extrude(makeShape(D.wallContour), TH, [wFaceMat, wSideMat]));

    var outMat = new THREE.LineBasicMaterial({ color: 0x99bbdd, transparent: true, opacity: 0.35 });
    [0, TH].forEach(function (z) {
      var pts = D.wallContour.map(function (p) { return v3(p.x, p.y, z); });
      pts.push(pts[0].clone());
      addLine(pts, outMat, layers.wall);
    });
    D.wallContour.forEach(function (p) {
      addLine([v3(p.x, p.y, 0), v3(p.x, p.y, TH)], outMat, layers.wall);
    });

    // 砖块
    brickMeshes = [];
    D.slices.forEach(function (sl, idx) {
      var clr = BRICK_COLORS[sl.col % BRICK_COLORS.length];
      var fMat = new THREE.MeshStandardMaterial({
        color: clr.face, roughness: 0.75, metalness: 0.03,
        polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
      });
      var sMat = new THREE.MeshStandardMaterial({
        color: clr.side, roughness: 0.80, metalness: 0.03,
        polygonOffset: true, polygonOffsetFactor: -1, polygonOffsetUnits: -1
      });
      var mesh = extrude(makeShape(sl.contour), TH, [fMat, sMat]);
      mesh.position.z = 0;
      mesh.name = 'slice_' + idx;
      var oxs = sl.contour.map(function (p) { return p.x; });
      var oys = sl.contour.map(function (p) { return p.y; });
      mesh.userData = {
        col: sl.col, gluePn: sl.gluePn || null,
        hasGlue: sl.gluePn && sl.gluePn !== null,
        brickW: Math.max.apply(null, oxs) - Math.min.apply(null, oxs),
        brickH: Math.max.apply(null, oys) - Math.min.apply(null, oys),
        brickT: TH, pn: sl.pn || ''
      };
      layers.slices.add(mesh);
      brickMeshes.push(mesh);
    });

    // 接缝线
    var jMat = new THREE.LineBasicMaterial({ color: 0xff6060 });
    var jFaint = new THREE.LineBasicMaterial({ color: 0xff6060, transparent: true, opacity: 0.4 });
    var bBoxMat = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.28 });
    D.slices.forEach(function (sl) {
      [0, TH].forEach(function (z) {
        var pts = sl.contour.map(function (p) { return v3(p.x, p.y, z); });
        pts.push(pts[0].clone());
        addLine(pts, bBoxMat, layers.joints);
      });
      if (!sl.glueSegs) return;
      sl.glueSegs.forEach(function (seg) {
        var fp = [v3(seg.s.x, seg.s.y, 0), v3(seg.e.x, seg.e.y, 0)];
        var bp = [v3(seg.s.x, seg.s.y, TH), v3(seg.e.x, seg.e.y, TH)];
        addLine(fp, jMat, layers.joints); addLine(bp, jMat, layers.joints);
        addLine([fp[0], bp[0]], jFaint, layers.joints); addLine([fp[1], bp[1]], jFaint, layers.joints);
      });
    });

    // 尺寸标注
    var dimMat = new THREE.LineBasicMaterial({ color: 0xffd700 });
    var dashMat = new THREE.LineDashedMaterial({ color: 0xffd700, dashSize: 14, gapSize: 8 });
    var TICK = 32, OFFX = 160, OFFY = 160, OFFZ = 180;
    function dimSeg(p1, p2, tick, axis) {
      addLine([p1, p2], dimMat, layers.dim);
      var t = tick;
      if (axis === 'x') {
        addLine([v3(p1.x, p1.y - t, p1.z), v3(p1.x, p1.y + t, p1.z)], dimMat, layers.dim);
        addLine([v3(p2.x, p2.y - t, p2.z), v3(p2.x, p2.y + t, p2.z)], dimMat, layers.dim);
      } else if (axis === 'y') {
        addLine([v3(p1.x - t, p1.y, p1.z), v3(p1.x + t, p1.y, p1.z)], dimMat, layers.dim);
        addLine([v3(p2.x - t, p2.y, p2.z), v3(p2.x + t, p2.y, p2.z)], dimMat, layers.dim);
      } else {
        addLine([v3(p1.x, p1.y - t, p1.z), v3(p1.x, p1.y + t, p1.z)], dimMat, layers.dim);
        addLine([v3(p2.x, p2.y - t, p2.z), v3(p2.x, p2.y + t, p2.z)], dimMat, layers.dim);
      }
    }
    var yMaxW = Math.max.apply(null, D.wallContour.map(function (p) { return p.y; }));
    var xMaxW = Math.max.apply(null, D.wallContour.map(function (p) { return p.x; }));
    dimSeg(v3(xMinW, -OFFY, 0), v3(xMaxW, -OFFY, 0), TICK, 'x');
    addLine([v3(xMinW, yMinW, 0), v3(xMinW, -OFFY, 0)], dashMat, layers.dim);
    addLine([v3(xMaxW, yMinW, 0), v3(xMaxW, -OFFY, 0)], dashMat, layers.dim);
    dimSeg(v3(xMinW - OFFX, yMinW, 0), v3(xMinW - OFFX, yMaxW, 0), TICK, 'y');
    addLine([v3(xMinW, yMinW, 0), v3(xMinW - OFFX, yMinW, 0)], dashMat, layers.dim);
    addLine([v3(xMinW, yMaxW, 0), v3(xMinW - OFFX, yMaxW, 0)], dashMat, layers.dim);
    dimSeg(v3(xMaxW + OFFZ, -OFFY, 0), v3(xMaxW + OFFZ, -OFFY, TH), TICK, 'z');
    addLine([v3(xMaxW, yMinW, 0), v3(xMaxW + OFFZ, -OFFY, 0)], dashMat, layers.dim);
    addLine([v3(xMaxW, yMinW, TH), v3(xMaxW + OFFZ, -OFFY, TH)], dashMat, layers.dim);

    D.slices.forEach(function (sl) {
      var oxs = sl.contour.map(function (p) { return p.x; });
      var xMinS = Math.min.apply(null, oxs), xMaxS = Math.max.apply(null, oxs);
      var yOff = -OFFY - 75 - sl.col * 52;
      dimSeg(v3(xMinS, yOff, 0), v3(xMaxS, yOff, 0), 22, 'x');
      addLine([v3(xMinS, yMinW, 0), v3(xMinS, yOff, 0)], dashMat, layers.dim);
      addLine([v3(xMaxS, yMinW, 0), v3(xMaxS, yOff, 0)], dashMat, layers.dim);
    });

    // 钢筋槽（Groove 切除效果）
    if (D.rebarSlots && D.rebarSlots.length > 0) {
      var grooveMat = new THREE.MeshStandardMaterial({
        color: 0x2a2a2a, roughness: 0.85, metalness: 0.1
      });
      var edgeMat = new THREE.LineBasicMaterial({
        color: 0x666666, linewidth: 1
      });
              rebarMeshes = [];
      rebarHitMeshes = [];
      var HIT_PAD = 5; // 钢筋槽命中容差 (mm)
      D.rebarSlots.forEach(function (sl) {
        var dx = Math.abs(sl.endX - sl.startX);
        var dz = Math.abs(sl.endZ - sl.startZ);
        var isHoriz = dx >= dz;
        var bx, by, bz;
        if (isHoriz) {
          // 水平槽：沿 X 方向（BIM X → Three.js X）
          bx = dx;
          by = sl.diameter;
          bz = sl.horizontalDepth || sl.diameter;
        } else {
          // 垂直槽：沿 Z 方向（BIM Z → Three.js Y）
          bx = sl.diameter;
          by = dz;
          bz = sl.verticalDepth || sl.diameter;
        }
        // 深色槽体
        var geo = new THREE.BoxGeometry(bx, by, bz);
        var mesh = new THREE.Mesh(geo, grooveMat);
        mesh.position.set(
          (sl.startX + sl.endX) / 2,
          (sl.startZ + sl.endZ) / 2,
          -bz / 2
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.userData = {
          direction: isHoriz ? t('rebar_horiz') : t('rebar_vert'),
          diameter: sl.diameter,
          length: isHoriz ? dx : dz,
          depth: isHoriz ? (sl.horizontalDepth || sl.diameter) : (sl.verticalDepth || sl.diameter),
          pn: sl.pn || '',
          startX: sl.startX, startY: sl.startZ, startZ: sl.startZ,
          endX: sl.endX, endY: sl.endZ, endZ: sl.endZ
        };
        layers.rebars.add(mesh);
        rebarMeshes.push(mesh);
        // 不可见的扩大命中区域，提升悬停体验
        var hitGeo = new THREE.BoxGeometry(
          isHoriz ? bx : bx + HIT_PAD * 2,
          isHoriz ? by + HIT_PAD * 2 : by,
          bz + HIT_PAD * 2
        );
        var hitMesh = new THREE.Mesh(hitGeo, new THREE.MeshBasicMaterial({ visible: false }));
        hitMesh.position.copy(mesh.position);
        hitMesh.userData = mesh.userData;
        layers.rebars.add(hitMesh);
        rebarHitMeshes.push(hitMesh);
        // 槽口边缘线
        var edgeGeo = new THREE.EdgesGeometry(geo);
        var edgeLine = new THREE.LineSegments(edgeGeo, edgeMat);
        edgeLine.position.copy(mesh.position);
        layers.rebars.add(edgeLine);
      });
      notifyRaw('status:' + t('status_rebar_done_prefix') + D.rebarSlots.length + t('status_rebar_done_suffix'));
    }
    var gnd = new THREE.Mesh(new THREE.PlaneGeometry(16000, 16000), new THREE.MeshStandardMaterial({ color: 0x181828, roughness: 1.0 }));
    gnd.rotation.x = -Math.PI / 2; gnd.position.set(cx, -3, cz); gnd.receiveShadow = true;
    scene.add(gnd);
    var grid = new THREE.GridHelper(14000, 70, 0x222244, 0x1a1a33);
    grid.position.set(cx, -2, cz); scene.add(grid);
    var axes = new THREE.AxesHelper(360);
    axes.position.set(xMinW - 200, yMinW - 200, 0); scene.add(axes);

    // 边缘列表
    var CR = [
      { x: xMinW, y: yMinW, z: 0 }, { x: xMaxW, y: yMinW, z: 0 },
      { x: xMaxW, y: yMaxW, z: 0 }, { x: xMinW, y: yMaxW, z: 0 },
      { x: xMinW, y: yMinW, z: TH }, { x: xMaxW, y: yMinW, z: TH },
      { x: xMaxW, y: yMaxW, z: TH }, { x: xMinW, y: yMaxW, z: TH }
    ];
    function mkE(a, b, type) {
      var A = v3(CR[a].x, CR[a].y, CR[a].z), B = v3(CR[b].x, CR[b].y, CR[b].z);
      return { A: A, B: B, type: type, len: A.distanceTo(B) };
    }
    var bW = (+(xMaxW - xMinW)).toFixed(1), bH = (+(yMaxW - yMinW)).toFixed(1), bT = (+TH).toFixed(1);
    EDGES = [
      mkE(0, 1, t('edge_width')+bW+'mm'), mkE(1, 2, t('edge_height')+bH+'mm'),
      mkE(2, 3, t('edge_width')+bW+'mm'), mkE(3, 0, t('edge_height')+bH+'mm'),
      mkE(4, 5, t('edge_width')+bW+'mm'), mkE(5, 6, t('edge_height')+bH+'mm'),
      mkE(6, 7, t('edge_width')+bW+'mm'), mkE(7, 4, t('edge_height')+bH+'mm'),
      mkE(0, 4, t('edge_thickness')+bT+'mm'), mkE(1, 5, t('edge_thickness')+bT+'mm'),
      mkE(2, 6, t('edge_thickness')+bT+'mm'), mkE(3, 7, t('edge_thickness')+bT+'mm')
    ];

    notifyRaw('status:' + t('status_scene_rebuilt'));
  }

  function clearScene() {
    if (animateId) cancelAnimationFrame(animateId);
    document.getElementById('info-panel').style.display = 'none';
    document.getElementById('legend').style.display = 'none';
    document.getElementById('brick-tooltip').style.display = 'none';
    document.getElementById('rebar-tooltip').style.display = 'none';
    hovBrick = null;
    function disposeGroup(group) {
      if (!group || !group.children) return;
      while (group.children.length > 0) {
        var child = group.children[0];
        disposeGroup(child);
        group.remove(child);
        if (child.geometry) child.geometry.dispose();
        if (child.material) {
          if (Array.isArray(child.material)) child.material.forEach(function (m) { m.dispose(); });
          else child.material.dispose();
        }
      }
      if (group.parent) group.parent.remove(group);
    }
    for (var k in layers) { if (layers[k]) disposeGroup(layers[k]); }
    layers = {}; brickMeshes = []; rebarMeshes = []; rebarHitMeshes = []; EDGES = [];
    (function reAnimate() {
      animateId = requestAnimationFrame(reAnimate);
      controls.update(); renderer.render(scene, camera);
    })();
  }

  /* ═══ 鼠标交互（边缘测量 → postMessage / 砖块悬浮 → HTML DOM） ═══ */
  function setupMouseInteraction() {
    var ray = new THREE.Raycaster();
    var mouse = new THREE.Vector2();
    var PICK = 28;

    function toScr(p3) {
      var p = p3.clone().project(camera);
      return { x: (p.x + 1) / 2 * window.innerWidth, y: -(p.y - 1) / 2 * window.innerHeight };
    }
    function sDist(px, py, ax, ay, bx, by) {
      var dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
      if (l2 === 0) return Math.hypot(px - ax, py - ay);
      var t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / l2));
      return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
    }
    function hlBrick(mesh) {
      if (hovBrick === mesh) return;
      clearHL();
      hovBrick = mesh;
      (Array.isArray(mesh.material) ? mesh.material : [mesh.material])
        .forEach(function (m) { if (m.emissive) m.emissive.set(0x442200); });
    }
    function clearHL() {
      if (!hovBrick) return;
      (Array.isArray(hovBrick.material) ? hovBrick.material : [hovBrick.material])
        .forEach(function (m) { if (m.emissive) m.emissive.set(0x000000); });
      hovBrick = null;
    }

    var tipB = document.getElementById('brick-tooltip');
    var tipBShown = false;

    var tipR = document.getElementById('rebar-tooltip');
    var tipRShown = false;

    window.addEventListener('mousemove', function (e) {
      var mx = e.clientX, my = e.clientY;

      /* ── 边缘测量 → postMessage ── */
      var best = null, bd = 1e9;
      EDGES.forEach(function (ed) {
        var sA = toScr(ed.A), sB = toScr(ed.B);
        var d = sDist(mx, my, sA.x, sA.y, sB.x, sB.y);
        if (d < bd) { bd = d; best = ed; }
      });
      if (best && bd < PICK) {
        var pos = hlLine.geometry.attributes.position;
        pos.setXYZ(0, best.A.x, best.A.y, best.A.z);
        pos.setXYZ(1, best.B.x, best.B.y, best.B.z);
        pos.needsUpdate = true; hlLine.visible = true;
        notify('edgeMeasure', {
          type: best.type, length: Math.round(best.len * 10) / 10,
          start: { x: Math.round(best.A.x*10)/10, y: Math.round(best.A.y*10)/10, z: Math.round(best.A.z*10)/10 },
          end: { x: Math.round(best.B.x*10)/10, y: Math.round(best.B.y*10)/10, z: Math.round(best.B.z*10)/10 }
        });
      } else {
        hlLine.visible = false;
        notifyRaw('edgeMeasure:');
      }

      /* ── 钢筋槽悬浮（优先检测） ── */
      mouse.set((mx / window.innerWidth) * 2 - 1, -(my / window.innerHeight) * 2 + 1);
      ray.setFromCamera(mouse, camera);
      var rebarHits = ray.intersectObjects(rebarHitMeshes, false);
      if (rebarHits.length > 0) {
        var rud = rebarHits[0].object.userData;
        // 先隐藏砖块 tooltip
        if (tipBShown) { tipB.style.display = 'none'; tipBShown = false; }
        clearHL();
        document.getElementById('rt-dir').textContent = rud.direction;
        document.getElementById('rt-dia').textContent = (+rud.diameter).toFixed(1) + ' mm';
        document.getElementById('rt-len').textContent = (+rud.length).toFixed(1) + ' mm';
        document.getElementById('rt-dep').textContent = (+rud.depth).toFixed(1) + ' mm';
        document.getElementById('rt-pn').textContent = rud.pn || '—';
        document.getElementById('rt-start').textContent =
          '(' + (+rud.startX).toFixed(1) + ', ' + (+rud.startY).toFixed(1) + ')';
        document.getElementById('rt-end').textContent =
          '(' + (+rud.endX).toFixed(1) + ', ' + (+rud.endY).toFixed(1) + ')';
        if (!tipRShown) {
          tipR.style.display = 'block';
          tipRShown = true;
        }
        var rCurLeft = parseFloat(tipR.style.left) || 0;
        var rCurTop = parseFloat(tipR.style.top) || 0;
        if (Math.abs(mx + 18 - rCurLeft) > 40 || Math.abs(my + 18 - rCurTop) > 40) {
          placeEl(tipR, mx, my, 0);
        }
        return;
      }
      // 隐藏钢筋 tooltip
      if (tipRShown) { tipR.style.display = 'none'; tipRShown = false; }

      /* ── 砖块悬浮 → HTML 面板 ── */
      // 砖块隐藏时不显示悬浮信息
      if (layers && layers.slices && !layers.slices.visible) {
        clearHL();
        if (tipBShown) { tipB.style.display = 'none'; tipBShown = false; }
        return;
      }
      mouse.set((mx / window.innerWidth) * 2 - 1, -(my / window.innerHeight) * 2 + 1);
      ray.setFromCamera(mouse, camera);
      var hits = ray.intersectObjects(brickMeshes, false);
      if (hits.length > 0) {
        var ud = hits[0].object.userData;
        hlBrick(hits[0].object);
        // 仅首次显示时设置位置，之后不再跳动
        document.getElementById('bt-col').textContent = t('brick_col_prefix') + ud.col + t('brick_col_suffix');
        document.getElementById('bt-w').textContent = (+ud.brickW).toFixed(1) + ' mm';
        document.getElementById('bt-h').textContent = (+ud.brickH).toFixed(1) + ' mm';
        document.getElementById('bt-t').textContent = (+ud.brickT).toFixed(1) + ' mm';
        document.getElementById('bt-glue').textContent = ud.hasGlue ? t('brick_glue_yes') + ud.gluePn + t('brick_glue_close') : t('brick_glue_no');
        document.getElementById('bt-pn').textContent = ud.pn || '—';
        if (!tipBShown) {
          tipB.style.display = 'block';
          tipBShown = true;
        }
        // 更新位置：抑制频繁跳动，只在偏移较大时才移动
        var curLeft = parseFloat(tipB.style.left) || 0;
        var curTop = parseFloat(tipB.style.top) || 0;
        if (Math.abs(mx + 18 - curLeft) > 40 || Math.abs(my + 18 - curTop) > 40) {
          placeEl(tipB, mx, my, 0);
        }
      } else {
        clearHL();
        if (tipBShown) {
          tipB.style.display = 'none';
          tipBShown = false;
        }
      }
    });

    renderer.domElement.addEventListener('mouseleave', function () {
      hlLine.visible = false; clearHL();
      notifyRaw('edgeMeasure:');
      if (tipBShown) { tipB.style.display = 'none'; tipBShown = false; }
      if (tipRShown) { tipR.style.display = 'none'; tipRShown = false; }
    });
  }

  /* ═══ 启动 ═══ */
  window.addEventListener('load', function () {
    if (typeof THREE === 'undefined') { notifyRaw('status:' + t('status_threejs_fail')); return; }
    if (typeof THREE.OrbitControls === 'undefined') { notifyRaw('status:' + t('status_orbit_fail')); return; }
    initScene();
    notifyRaw('status:' + t('status_engine_init'));
  });
</script>

    brick_col_prefix: { zh: '第 ', en: 'Col ' },
    brick_col_suffix: { zh: ' 列', en: '' },
    brick_glue_yes: { zh: '✅ 有 (pn:', en: '✅ Yes (pn:' },
    brick_glue_no: { zh: '❌ 无', en: '❌ No' },
    brick_glue_close: { zh: ')', en: ')' },
    rebar_horiz: { zh: '水平槽 (X)', en: 'Horizontal (X)' },
    rebar_vert: { zh: '垂直槽 (Z)', en: 'Vertical (Z)' },
    brick_unit: { zh: '块', en: 'pcs' },
    vertex_unit: { zh: '个', en: 'pts' },
    rebar_unit: { zh: '条', en: 'slots' }
  };

  /** 获取当前语言的翻译 */
  window.t = function(key, langCode) {
    var lc = langCode || lang;
    var entry = I18N[key];
    if (!entry) return '[[' + key + ']]';
    return entry[lc] || entry['zh'];
  };

  /** 刷新所有 data-i18n 元素 */
  window.setLanguage = function(langCode) {
    lang = langCode === 'en' ? 'en' : 'zh';
    document.documentElement.lang = lang === 'en' ? 'en-US' : 'zh-CN';
    // 更新 data-i18n 属性元素
    document.querySelectorAll('[data-i18n]').forEach(function(el) {
      var key = el.getAttribute('data-i18n');
      var entry = I18N[key];
      if (entry) {
        el.textContent = entry[lang] || entry['zh'];
      }
    });
    // 更新页面标题
    document.title = lang === 'zh' ? 'AAC 墙体 3D 渲染引擎' : 'AAC Wall 3D Render Engine';
  };

  window.getCurrentLanguage = function() { return lang; };
})();
</script>
</body>
</html>
