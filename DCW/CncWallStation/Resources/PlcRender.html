<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLC 指令 3D 渲染</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { overflow: hidden; background: #1a1a2e; font-family: 'Segoe UI', sans-serif; }
        canvas { display: block; }

        /* 图例 */
        #legend {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.7); color: #ccc;
            padding: 10px 14px; border-radius: 6px;
            font-size: 12px; pointer-events: none;
        }
        .legend-item { display: flex; align-items: center; margin: 2px 0; }
        .legend-color { width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; }

        /* 提示 */
        #hint {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.6); color: #888;
            padding: 6px 16px; border-radius: 4px; font-size: 11px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="legend"></div>
    <div id="hint">左键旋转 | 滚轮缩放 | 右键平移</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // ==================== 场景初始化 ====================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 10, 50000);
        camera.position.set(5000, 3000, 8000);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // ==================== 光照 ====================
        const ambientLight = new THREE.AmbientLight(0x404060, 1.2);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.5);
        directionalLight.position.set(5000, 10000, 5000);
        scene.add(directionalLight);
        const directionalLight2 = new THREE.DirectionalLight(0x8888cc, 0.6);
        directionalLight2.position.set(-5000, 2000, -5000);
        scene.add(directionalLight2);

        // ==================== 网格辅助 ====================
        const gridHelper = new THREE.GridHelper(8000, 40, 0x444466, 0x222244);
        scene.add(gridHelper);

        // 坐标轴
        const axisLength = 4000;
        const xAxis = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(axisLength,0,0)]),
            new THREE.LineBasicMaterial({ color: 0xff4444 })
        );
        const yAxis = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,axisLength,0)]),
            new THREE.LineBasicMaterial({ color: 0x44ff44 })
        );
        const zAxis = new THREE.Line(
            new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,axisLength)]),
            new THREE.LineBasicMaterial({ color: 0x4444ff })
        );
        scene.add(xAxis, yAxis, zAxis);

        // ==================== OrbitControls ====================
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.08;
        controls.target.set(0, 0, 0);
        controls.update();

        // ==================== 颜色映射（按 T 值） ====================
        const tColorMap = {
            1: 0x44aaff,  // Mill 铣刀 - 蓝色
            2: 0xff6644,  // RebarCutter - 橙红
            3: 0xffcc00,  // LargeDrill - 黄色
            4: 0x44ff88,  // StepCutter - 绿色
            6: 0xff44ff,  // Sealing - 紫色
            7: 0x00dddd,  // WindowCutter - 青色
            8: 0xff8844,  // SlotCutter - 橙色
            9: 0x88aaff,  // SmallDrill - 淡蓝
            10: 0xff88aa, // FaceHole - 粉色
            16: 0xaaaaaa  // XpsOffset - 灰色
        };
        const defaultColor = 0x888888;

        function getTColor(t) {
            return tColorMap[t] || defaultColor;
        }

        // ==================== 存储所有指令对象 ====================
        let instructionObjects = [];    // { mesh, originalColor }
        let highlightedIndex = -1;

        // ==================== 图例生成 ====================
        function buildLegend(usedTTypes) {
            const legend = document.getElementById('legend');
            let html = '<div style="font-weight:bold;margin-bottom:4px;">刀具图例</div>';
            const sorted = [...usedTTypes].sort((a,b) => a-b);
            sorted.forEach(t => {
                const color = '#' + getTColor(t).toString(16).padStart(6, '0');
                html += `<div class="legend-item">
                    <span class="legend-color" style="background:${color}"></span>
                    T${t}
                </div>`;
            });
            legend.innerHTML = html;
        }

        // ==================== 渲染指令 ====================
        window.renderInstructions = function(instructionsJson) {
            clearHighlight();
            instructionObjects.forEach(obj => {
                scene.remove(obj.mesh);
                obj.mesh.geometry.dispose();
                obj.mesh.material.dispose();
            });
            instructionObjects = [];
            document.getElementById('legend').innerHTML = '';

            let instructions;
            try {
                instructions = typeof instructionsJson === 'string'
                    ? JSON.parse(instructionsJson)
                    : instructionsJson;
            } catch(e) {
                console.error('指令解析失败:', e);
                return;
            }

            if (!instructions || instructions.length === 0) return;

            // 计算包围盒
            let minX = Infinity, minY = Infinity, minZ = Infinity;
            let maxX = -Infinity, maxY = -Infinity, maxZ = -Infinity;
            const usedTTypes = new Set();

            instructions.forEach(inst => {
                const x0 = inst.X0, y0 = inst.Y0, z0 = inst.Z0;
                const x1 = inst.X1, y1 = inst.Y1, z1 = inst.Z1;
                minX = Math.min(minX, x0, x1); maxX = Math.max(maxX, x0, x1);
                minY = Math.min(minY, y0, y1); maxY = Math.max(maxY, y0, y1);
                minZ = Math.min(minZ, z0, z1); maxZ = Math.max(maxZ, z0, z1);
                usedTTypes.add(inst.T);
            });

            buildLegend(usedTTypes);

            // 调整相机
            const cx = (minX + maxX) / 2;
            const cy = (minY + maxY) / 2;
            const cz = (minZ + maxZ) / 2;
            const span = Math.max(maxX - minX, maxY - minY, maxZ - minZ, 1000);
            const dist = span * 2.5;
            camera.position.set(cx + dist * 0.6, cy + dist * 0.5, cz + dist * 0.8);
            controls.target.set(cx, cy, cz);
            controls.update();

            // 批量创建方块
            instructions.forEach((inst, idx) => {
                const x0 = inst.X0, y0 = inst.Y0, z0 = inst.Z0;
                const x1 = inst.X1, y1 = inst.Y1, z1 = inst.Z1;

                const centerX = (x0 + x1) / 2;
                const centerY = (y0 + y1) / 2;
                const centerZ = (z0 + z1) / 2;
                const w = Math.max(Math.abs(x1 - x0), 2);
                const h = Math.max(Math.abs(y1 - y0), 2);
                const d = Math.max(Math.abs(z1 - z0), 2);

                const color = getTColor(inst.T);
                const material = new THREE.MeshPhongMaterial({
                    color: color,
                    transparent: true,
                    opacity: 0.6,
                    side: THREE.DoubleSide
                });

                const geometry = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(centerX, centerY, centerZ);

                // 边框
                const edgeGeometry = new THREE.EdgesGeometry(geometry);
                const edgeMaterial = new THREE.LineBasicMaterial({ color: color, transparent: true, opacity: 0.9 });
                const edgeLine = new THREE.LineSegments(edgeGeometry, edgeMaterial);
                mesh.add(edgeLine);

                scene.add(mesh);
                instructionObjects.push({ mesh, originalColor: color });
            });
        };

        // ==================== 高亮选中指令 ====================
        window.highlightInstruction = function(index) {
            clearHighlight();

            if (index < 0 || index >= instructionObjects.length) return;

            const obj = instructionObjects[index];
            obj.mesh.material.color.set(0xff0000);
            obj.mesh.material.opacity = 0.9;
            obj.mesh.material.emissive = new THREE.Color(0x440000);
            highlightedIndex = index;

            // 将相机对准该指令
            const pos = obj.mesh.position;
            controls.target.copy(pos);
            controls.update();
        };

        window.clearHighlight = function() {
            if (highlightedIndex >= 0 && highlightedIndex < instructionObjects.length) {
                const obj = instructionObjects[highlightedIndex];
                obj.mesh.material.color.set(obj.originalColor);
                obj.mesh.material.opacity = 0.6;
                obj.mesh.material.emissive = new THREE.Color(0x000000);
                highlightedIndex = -1;
            }
        };


        // ==================== 动画循环 ====================
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // ==================== 窗口缩放 ====================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // ==================== 键盘快捷键 ====================
        window.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'f': // 重置视角
                    if (instructionObjects.length > 0) {
                        const box = new THREE.Box3();
                        instructionObjects.forEach(o => box.expandByObject(o.mesh));
                        const center = box.getCenter(new THREE.Vector3());
                        const size = box.getSize(new THREE.Vector3());
                        controls.target.copy(center);
                        camera.position.copy(center.clone().add(new THREE.Vector3(size.x, size.y, size.z * 2)));
                        controls.update();
                    }
                    break;
            }
        });
    </script>
</body>
</html>
